<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Millhaven Transit Authority — Mobile</title>
<style>
  :root {
    --navy: #17223b;
    --navy-light: #223258;
    --amber: #e8a33d;
    --amber-dim: #a97a2e;
    --off-white: #f2ede3;
    --line-grey: #4a5570;
    --locked-grey: #5c6478;
    --ok-green: #4f8a5b;
    --warn-red: #b3453f;
    --font-ui: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'Consolas', 'SF Mono', Menlo, monospace;
  }

  * {
    box-sizing: border-box;
    /* Suppress the default grey/blue tap flash so custom :active states show through */
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--navy);
    color: var(--off-white);
    font-family: var(--font-ui);
    overflow: hidden;
    /* Keep scroll gestures inside the app: no page rubber-band / pull-to-refresh */
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* Pad past the status bar / notch (top) and rounded corners in landscape (sides) */
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
    background: var(--navy-light);
    border-bottom: 2px solid var(--amber);
    flex-shrink: 0;
    gap: 8px;
  }

  header .title {
    font-weight: 700;
    letter-spacing: 0.03em;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--amber);
    line-height: 1.3;
  }

  .stat-group {
    display: flex;
    gap: 12px;
    font-family: var(--font-mono);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.2;
  }

  .stat .label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9aa3bd;
  }

  .stat .value {
    font-size: 14px;
    font-weight: 700;
  }

  .stat.cash .value { color: var(--ok-green); }
  .stat.rep .value { color: var(--amber); }

  /* MAIN SCROLL AREA */
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .view { display: none; padding-bottom: 16px; }
  .view.active { display: block; }

  .section {
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .section-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9aa3bd;
    margin: 0 0 10px 0;
    font-weight: 700;
  }

  .placeholder-box {
    border: 1px dashed var(--line-grey);
    border-radius: 4px;
    padding: 14px;
    font-size: 12px;
    color: #7b84a0;
    text-align: center;
  }

  .notice-box {
    border: 1px solid var(--line-grey);
    border-radius: 4px;
    padding: 12px;
    font-size: 12px;
    color: var(--off-white);
    line-height: 1.5;
  }

  .notice-box strong { color: var(--amber); }

  /* CONTROL BOARD (persistent dispatcher's mimic panel) */
  #control-board {
    flex-shrink: 0;
    background: var(--navy-light);
    border-bottom: 2px solid var(--amber);
    padding: 6px 10px 7px;
  }

  .cb-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
  }

  .cb-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
  }

  .cb-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ok-green);
  }

  .cb-status::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok-green);
    box-shadow: 0 0 6px var(--ok-green);
    animation: cb-blink 2.2s ease-in-out infinite;
  }

  .cb-screen {
    position: relative;
    height: 30vh;
    max-height: 208px;
    min-height: 146px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.5);
    background-color: #070b17;
    background-image:
      radial-gradient(ellipse at 50% 45%, rgba(34,50,88,0.35), rgba(7,11,23,0) 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 14px);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.75);
    overflow: hidden;
  }

  #cb-svg {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: manipulation;
  }

  .cb-ticker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8891ab;
    white-space: nowrap;
    overflow: hidden;
  }

  .cb-ticker span { overflow: hidden; text-overflow: ellipsis; }
  #cb-ticker-train { color: var(--amber); flex: 1 1 auto; min-width: 0; }
  #cb-ticker-net { flex: 0 0 auto; }

  /* Track segments */
  .cb-track {
    stroke: #2b3550;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 2 11;
    fill: none;
    opacity: 0.7;
  }

  .cb-track.built {
    stroke: var(--amber);
    stroke-width: 5;
    stroke-dasharray: none;
    opacity: 1;
    filter: drop-shadow(0 0 3px rgba(232,163,61,0.7));
  }

  /* Station indicator lamps */
  .cb-station { cursor: pointer; }
  .cb-station .ring { fill: #0c1326; stroke-width: 2.5; }
  .cb-station.unlocked .ring { stroke: var(--amber-dim); }
  .cb-station.locked .ring { stroke: #39435f; stroke-dasharray: 4 4; }

  .cb-station.unlocked .lamp {
    fill: var(--amber);
    filter: drop-shadow(0 0 5px rgba(232,163,61,0.9));
  }
  .cb-station.locked .lamp { fill: #141d33; }

  .cb-station .num {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .cb-station.unlocked .num { fill: var(--navy); }
  .cb-station.locked .num { fill: #55607e; }

  .cb-station.selected .ring { stroke: #ffffff; stroke-width: 3.5; }

  /* Queue-status LED per unlocked station */
  .cb-led { stroke: rgba(0,0,0,0.5); stroke-width: 1; }
  .cb-led.ok { fill: var(--ok-green); filter: drop-shadow(0 0 3px rgba(79,138,91,0.9)); }
  .cb-led.warn { fill: var(--amber); filter: drop-shadow(0 0 3px rgba(232,163,61,0.9)); }
  .cb-led.full { fill: var(--warn-red); filter: drop-shadow(0 0 4px rgba(179,69,63,1)); }

  /* Train locator halo */
  .cb-train-halo {
    fill: none;
    stroke: var(--ok-green);
    stroke-width: 3;
    filter: drop-shadow(0 0 6px rgba(79,138,91,0.9));
    animation: cb-pulse 1.5s ease-in-out infinite;
  }

  @keyframes cb-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes cb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (prefers-reduced-motion: reduce) {
    .cb-status::before, .cb-train-halo { animation: none; }
  }

  /* STATION LIST */
  .station-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: var(--off-white);
    font-family: var(--font-ui);
    padding: 12px 14px;
    min-height: 60px;
    cursor: pointer;
  }

  .station-row:active { background: rgba(232,163,61,0.1); }

  .station-row .row-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--amber);
    background: var(--navy-light);
    border: 1px solid var(--amber-dim);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .station-row.locked .row-num {
    color: var(--locked-grey);
    border-color: var(--line-grey);
    border-style: dashed;
  }

  .station-row .row-main { flex: 1; min-width: 0; }

  .station-row .row-name {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
  }

  .station-row.locked .row-name { color: #9aa3bd; }

  .station-row .row-sub {
    font-size: 11px;
    color: #7b84a0;
    margin: 2px 0 0 0;
  }

  .station-row .row-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    flex-shrink: 0;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 3px;
    font-family: var(--font-mono);
  }

  .badge.queue { background: rgba(255,255,255,0.08); color: #c9cfdf; }
  .badge.queue.full { background: rgba(179,69,63,0.25); color: #d9736c; }
  .badge.train { background: var(--amber); color: var(--navy); }
  .badge.locked-cost { background: transparent; color: var(--locked-grey); border: 1px dashed var(--line-grey); }
  .badge.chevron { color: #7b84a0; background: transparent; font-size: 12px; }

  /* STATION DETAIL */
  .back-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--navy-light);
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: var(--amber);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 12px 14px;
    min-height: 44px;
    cursor: pointer;
  }

  .station-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--amber);
    margin: 0 0 2px 0;
  }

  .station-meta {
    font-size: 11px;
    color: #9aa3bd;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 10px 0;
  }

  .station-desc {
    font-size: 13px;
    line-height: 1.5;
    color: #d8d4c8;
    margin: 10px 0 0 0;
  }

  .lock-status {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .lock-status.unlocked { background: rgba(79,138,91,0.2); color: var(--ok-green); }
  .lock-status.locked { background: rgba(179,69,63,0.2); color: #d9736c; }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .summary-row.summary-net {
    font-weight: 700;
    border-top: 1px solid rgba(255,255,255,0.15);
    border-bottom: none;
    margin-top: 4px;
    padding-top: 10px;
  }

  .summary-row.summary-balance {
    color: var(--off-white);
    font-family: var(--font-mono);
    font-size: 12px;
    border-bottom: none;
  }

  .summary-pos { color: var(--ok-green); }
  .summary-neg { color: #d9736c; }

  /* QUEUE */
  .queue-sort-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .queue-sort-btn {
    flex: 1;
    background: var(--navy);
    border: 1px solid var(--line-grey);
    color: #9aa3bd;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 6px 4px;
    cursor: pointer;
    min-height: 36px;
  }

  .queue-sort-btn.active {
    border-color: var(--amber);
    color: var(--amber);
  }

  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .queue-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 9px 10px;
    font-size: 12px;
  }

  .queue-item .queue-dest { color: var(--off-white); font-weight: 600; }
  .queue-item .queue-wait { color: #9aa3bd; font-size: 10px; text-transform: uppercase; }
  .queue-item .queue-fare { color: var(--ok-green); font-family: var(--font-mono); font-weight: 700; }
  .queue-item.unhappy { border-color: var(--warn-red); }
  .queue-item.unhappy .queue-wait { color: #d9736c; font-weight: 700; }

  /* TRAIN VIEW */
  .train-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--off-white);
    margin: 0 0 4px 0;
  }

  .train-flavor {
    font-size: 12px;
    color: #9aa3bd;
    font-style: italic;
    margin: 0 0 10px 0;
  }

  .train-specs {
    display: flex;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #9aa3bd;
    flex-wrap: wrap;
  }

  .train-specs span strong { color: var(--off-white); }

  /* FLEET ROSTER */
  .fleet-roster {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }

  .fleet-chip {
    flex: 0 0 auto;
    min-width: 132px;
    text-align: left;
    background: var(--navy);
    border: 1px solid var(--line-grey);
    border-radius: 6px;
    color: var(--off-white);
    font-family: var(--font-ui);
    padding: 9px 12px;
    min-height: 48px;
    cursor: pointer;
  }

  .fleet-chip.active {
    border-color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--amber);
  }

  .fleet-chip:active { background: rgba(232,163,61,0.12); }

  .fleet-chip .fc-name { font-size: 13px; font-weight: 700; }
  .fleet-chip.active .fc-name { color: var(--amber); }

  .fleet-chip .fc-sub {
    font-size: 10px;
    color: #9aa3bd;
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  /* ROUTE STRIP (vertical line diagram) */
  .route-strip { padding: 4px 0; }

  .rs-row {
    display: flex;
    align-items: stretch;
    min-height: 44px;
  }

  .rs-marker {
    width: 34px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rs-marker::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 4px;
    margin-left: -2px;
    background: var(--amber-dim);
  }

  .rs-row:first-child .rs-marker::before { top: 50%; }
  .rs-row:last-child .rs-marker::before { bottom: 50%; }
  .rs-row.rs-single .rs-marker::before { display: none; }

  .rs-dot {
    position: relative;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--navy);
    border: 3px solid var(--amber);
    z-index: 1;
  }

  .rs-row.current .rs-dot {
    background: var(--amber);
    width: 18px;
    height: 18px;
  }

  .rs-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .rs-row:last-child .rs-body { border-bottom: none; }

  .rs-name { font-size: 14px; font-weight: 600; }
  .rs-row.current .rs-name { color: var(--amber); font-weight: 700; }

  .rs-note {
    font-size: 10px;
    color: #7b84a0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: var(--font-mono);
    text-align: right;
  }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 100px;
    min-height: 46px;
    background: var(--navy);
    border: 1px solid var(--line-grey);
    color: var(--off-white);
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  .btn:active { background: rgba(232,163,61,0.15); }

  .btn.primary {
    background: var(--amber-dim);
    color: var(--navy);
    border-color: var(--amber-dim);
  }

  .btn.primary:active { background: var(--amber); }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn.small {
    min-height: 40px;
    font-size: 11px;
    min-width: 70px;
    flex: 0 1 auto;
    padding: 0 12px;
  }

  /* ROUTE EDITOR: candidate stops */
  .candidate-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .candidate-btn {
    background: var(--navy);
    border: 1px solid var(--amber-dim);
    color: var(--off-white);
    border-radius: 16px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    min-height: 44px;
    cursor: pointer;
  }

  .candidate-btn:active { background: rgba(232,163,61,0.2); }

  /* BUILD VIEW */
  .segment-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    min-height: 62px;
  }

  .segment-row .seg-main { flex: 1; min-width: 0; }

  .segment-row .seg-names {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
  }

  .segment-row.unavailable .seg-names { color: #9aa3bd; }

  .segment-row .seg-sub {
    font-size: 11px;
    color: #7b84a0;
    margin: 3px 0 0 0;
  }

  .seg-status {
    flex-shrink: 0;
  }

  .seg-status .badge.built { background: rgba(79,138,91,0.2); color: var(--ok-green); }

  .seg-link {
    color: #7b84a0;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  /* BOTTOM NAV */
  nav {
    display: flex;
    background: var(--navy-light);
    border-top: 2px solid var(--amber);
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  nav button {
    flex: 1;
    min-height: 54px;
    background: transparent;
    border: none;
    border-right: 1px solid rgba(255,255,255,0.08);
    color: var(--off-white);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-transform: uppercase;
  }

  nav button:last-child { border-right: none; }
  nav button:active { background: rgba(232,163,61,0.15); }
  nav button.active { color: var(--amber); box-shadow: inset 0 3px 0 var(--amber); }

  nav button.primary {
    background: var(--amber-dim);
    color: var(--navy);
  }

  nav button.primary:active { background: var(--amber); }

  nav button .nav-note {
    display: block;
    font-size: 9px;
    font-weight: 400;
    color: inherit;
    opacity: 0.7;
    font-family: var(--font-mono);
    margin-top: 1px;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 28, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 16px;
  }

  .modal-overlay.visible { display: flex; }

  .modal-panel {
    background: var(--navy-light);
    border: 2px solid var(--amber);
    border-radius: 6px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .modal-header h2 {
    margin: 0;
    font-size: 15px;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .modal-body { padding: 16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Millhaven<br>Transit Authority</div>
    <div class="stat-group">
      <div class="stat date">
        <span class="label">Date</span>
        <span class="value" id="stat-date">Jan 1900</span>
      </div>
      <div class="stat cash">
        <span class="label">Cash</span>
        <span class="value" id="stat-cash">$0</span>
      </div>
      <div class="stat rep">
        <span class="label">Rep</span>
        <span class="value" id="stat-rep">0</span>
      </div>
    </div>
  </header>

  <div id="control-board">
    <div class="cb-topbar">
      <span class="cb-title">&#9673; Millhaven Network</span>
      <span class="cb-status">Live</span>
    </div>
    <div class="cb-screen">
      <svg id="cb-svg" viewBox="200 40 640 720" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="cb-ticker">
      <span id="cb-ticker-train">&mdash;</span>
      <span id="cb-ticker-net">&mdash;</span>
    </div>
  </div>

  <main>
    <div class="view" id="view-stations"></div>
    <div class="view" id="view-detail"></div>
    <div class="view" id="view-train"></div>
    <div class="view" id="view-build"></div>
  </main>

  <nav>
    <button id="nav-stations">Stations</button>
    <button id="nav-train">Train</button>
    <button id="nav-build">Build</button>
    <button id="nav-end-month" class="primary">End<br>Month</button>
  </nav>
</div>

<div id="summary-overlay" class="modal-overlay">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Monthly Summary</h2>
    </div>
    <div class="modal-body" id="summary-body"></div>
  </div>
</div>

<script src="game.js"></script>
<script>
(function () {
  'use strict';

  var MTA = window.MTA;

  // Alias shared sim data/helpers so the render code below reads unchanged.
  var STATIONS = MTA.STATIONS,
      CONNECTIONS = MTA.CONNECTIONS,
      MONTH_NAMES = MTA.MONTH_NAMES,
      TRACK_COST = MTA.TRACK_COST,
      QUEUE_MAX_PER_STATION = MTA.QUEUE_MAX_PER_STATION,
      TRAIN_TYPES = MTA.TRAIN_TYPES;
  var gx = MTA.gx,
      gy = MTA.gy,
      stationById = MTA.stationById,
      isTrackBuilt = MTA.isTrackBuilt,
      getAdjacency = MTA.getAdjacency,
      unlockedStationIds = MTA.unlockedStationIds,
      sortQueueEntries = MTA.sortQueueEntries,
      hasUnlockedNeighbor = MTA.hasUnlockedNeighbor,
      checkUnlockRequirements = MTA.checkUnlockRequirements,
      saveState = MTA.saveState;

  var state = MTA.state;
  // Desktop map modes have no meaning here; clear them so a shared save
  // doesn't come up stuck in build/route-edit mode.
  state.buildMode = false;
  state.routeEditMode = false;

  // Mobile UI state — never persisted, so it can't pollute the shared save.
  var ui = {
    view: 'stations',       // stations | detail | train | build
    detailStation: null,
    selectedTrain: null,    // which train the Train tab is focused on
    editingRoute: false,
    routeDraft: []
  };

  var svgNS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }

  // Thin wrappers over the shared mutating ops: call sim, surface any error,
  // then re-render.
  function unlockStation(stationId) {
    var res = MTA.unlockStation(stationId);
    if (!res.ok) { alert('Cannot unlock ' + stationById(stationId).name + ' yet:\n' + res.reasons.join('\n')); return; }
    renderAll();
  }

  function buildTrack(a, b) {
    var res = MTA.buildTrack(a, b);
    if (!res.ok) { if (res.reason) alert(res.reason); return; }
    renderAll();
  }

  function dispatchTrain(trainId) {
    if (!MTA.dispatchTrain(trainId)) return;
    renderAll();
  }

  function buyTrain(typeId) {
    var res = MTA.buyTrain(typeId);
    if (!res.ok) { if (res.reason) alert(res.reason); return; }
    ui.selectedTrain = res.train.id; // focus the newly bought train
    renderAll();
  }

  // The Train tab is focused on one train at a time; default to the first.
  function getSelectedTrain() {
    var t = null;
    if (ui.selectedTrain) {
      for (var i = 0; i < state.trains.length; i++) {
        if (state.trains[i].id === ui.selectedTrain) { t = state.trains[i]; break; }
      }
    }
    if (!t) { t = state.trains[0] || null; ui.selectedTrain = t ? t.id : null; }
    return t;
  }

  function endMonth() {
    var summary = MTA.endMonth();
    renderAll();
    showMonthlySummary(summary);
  }

  /* ---------- RENDERING ---------- */

  function fmtMoney(n) {
    return '$' + n.toLocaleString('en-US');
  }

  function setView(view) {
    ui.view = view;
    if (view !== 'detail') ui.detailStation = null;
    renderAll();
  }

  function openStation(id) {
    ui.detailStation = id;
    ui.view = 'detail';
    renderAll();
  }

  // Flag underserved districts (GDD §7) that earn a reputation-scaled subsidy.
  function subsidyNote(s) {
    if (MTA.UNDERSERVED_DISTRICT_STATIONS.indexOf(s.id) === -1) return '';
    var perStation = MTA.subsidyPerStation();
    return '<p class="station-desc" style="margin-top:8px;color:var(--amber);font-weight:600;">&#9733; Underserved district — serving it earns a ~' + fmtMoney(perStation) + '/mo government subsidy.</p>';
  }

  // One-line badge when the season shifts a station's demand (mirrors desktop).
  function seasonalNote(s) {
    var season = MTA.currentSeason();
    var f = MTA.seasonalDemandFactor(s, season.id);
    if (f > 1.05) {
      return '<p class="station-desc" style="margin-top:8px;color:var(--ok-green);font-weight:600;">&#9650; Busier than usual this ' + season.label.toLowerCase() + '.</p>';
    }
    if (f < 0.95) {
      return '<p class="station-desc" style="margin-top:8px;color:#d9736c;font-weight:600;">&#9660; Quieter than usual this ' + season.label.toLowerCase() + '.</p>';
    }
    return '';
  }

  function renderHeader() {
    document.getElementById('stat-date').textContent = MONTH_NAMES[state.month - 1] + ' ' + state.year + ' · ' + MTA.currentSeason().label;
    document.getElementById('stat-cash').textContent = fmtMoney(state.cash);
    document.getElementById('stat-rep').textContent = state.reputation;
  }

  function renderNav() {
    var tabs = { 'nav-stations': 'stations', 'nav-train': 'train', 'nav-build': 'build' };
    for (var btnId in tabs) {
      var active = ui.view === tabs[btnId] || (tabs[btnId] === 'stations' && ui.view === 'detail');
      document.getElementById(btnId).classList.toggle('active', active);
    }
  }

  /* Persistent dispatcher's control board: schematic mimic panel, always
     visible across tabs. Track lamps, live train locator, queue LEDs. Tapping
     a station lamp jumps to its detail from any tab. */
  function renderControlBoard() {
    var svg = document.getElementById('cb-svg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // Track segments — built ones glow, unbuilt read as faint dashed conduit.
    CONNECTIONS.forEach(function (pair) {
      var a = stationById(pair[0]);
      var b = stationById(pair[1]);
      svg.appendChild(svgEl('line', {
        x1: gx(a.col), y1: gy(a.row),
        x2: gx(b.col), y2: gy(b.row),
        'class': 'cb-track' + (isTrackBuilt(a.id, b.id) ? ' built' : '')
      }));
    });

    // Train locator — a pulsing halo ring on each train's current station.
    state.trains.forEach(function (train) {
      var s = stationById(train.atStation);
      if (!s) return;
      svg.appendChild(svgEl('circle', {
        'class': 'cb-train-halo', cx: gx(s.col), cy: gy(s.row), r: 27
      }));
    });

    // Station indicator lamps.
    STATIONS.forEach(function (s) {
      var unlocked = !!state.unlocked[s.id];
      var selected = ui.view === 'detail' && ui.detailStation === s.id;
      var g = svgEl('g', { 'class': 'cb-station ' + (unlocked ? 'unlocked' : 'locked') + (selected ? ' selected' : '') });
      g.appendChild(svgEl('circle', { 'class': 'ring', cx: gx(s.col), cy: gy(s.row), r: 22 }));
      g.appendChild(svgEl('circle', { 'class': 'lamp', cx: gx(s.col), cy: gy(s.row), r: 13 }));
      var num = svgEl('text', { 'class': 'num', x: gx(s.col), y: gy(s.row) });
      num.textContent = s.num;
      g.appendChild(num);

      // Queue-load LED (green ok / amber filling / red full) on the rim.
      if (unlocked) {
        var q = state.queues[s.id] || [];
        var cls = 'ok';
        if (q.length >= QUEUE_MAX_PER_STATION) cls = 'full';
        else if (q.length >= QUEUE_MAX_PER_STATION - 2) cls = 'warn';
        g.appendChild(svgEl('circle', { 'class': 'cb-led ' + cls, cx: gx(s.col) + 16, cy: gy(s.row) - 16, r: 4.5 }));
      }

      g.addEventListener('click', function () { openStation(s.id); });
      svg.appendChild(g);
    });

    renderTicker();
  }

  function renderTicker() {
    var train = state.trains[0];
    var trainTxt;
    if (!train) {
      trainTxt = 'No train';
    } else {
      var at = stationById(train.atStation);
      var atName = at ? at.name : '?';
      if (train.route.length >= 2) {
        var next = train.route[train.posIndex + train.dir];
        var nextName = next ? stationById(next).name : 'terminus';
        trainTxt = train.name + ' · at ' + atName + ' · next ' + nextName;
      } else {
        trainTxt = train.name + ' · at ' + atName + ' · no route';
      }
    }

    var trackBuilt = CONNECTIONS.filter(function (p) { return isTrackBuilt(p[0], p[1]); }).length;
    document.getElementById('cb-ticker-train').textContent = trainTxt;
    document.getElementById('cb-ticker-net').textContent =
      'stn ' + unlockedStationIds().length + '/' + STATIONS.length + ' · trk ' + trackBuilt;
  }

  function renderStationsView() {
    var view = document.getElementById('view-stations');
    view.innerHTML = '';

    STATIONS.forEach(function (s) {
      var unlocked = !!state.unlocked[s.id];
      var row = document.createElement('button');
      row.className = 'station-row' + (unlocked ? '' : ' locked');

      var right = '';
      if (unlocked) {
        var q = state.queues[s.id] || [];
        var full = q.length >= QUEUE_MAX_PER_STATION;
        var trainsHere = state.trains.filter(function (t) { return t.atStation === s.id; }).length;
        if (trainsHere) right += '<span class="badge train">Train' + (trainsHere > 1 ? ' &times;' + trainsHere : '') + '</span>';
        right += '<span class="badge queue' + (full ? ' full' : '') + '">' + q.length + '/' + QUEUE_MAX_PER_STATION + ' waiting</span>';
      } else {
        right += '<span class="badge locked-cost">' + fmtMoney(s.unlockCost) + ' · rep ' + s.unlockRep + '</span>';
      }
      right += '<span class="badge chevron">&#9654;</span>';

      row.innerHTML =
        '<span class="row-num">' + s.num + '</span>' +
        '<span class="row-main">' +
          '<p class="row-name">' + s.name + '</p>' +
          '<p class="row-sub">' + s.district + (unlocked ? '' : ' — locked') + '</p>' +
        '</span>' +
        '<span class="row-right">' + right + '</span>';

      row.addEventListener('click', function () { openStation(s.id); });
      view.appendChild(row);
    });
  }

  function renderDetailView() {
    var view = document.getElementById('view-detail');
    view.innerHTML = '';
    if (!ui.detailStation) {
      setView('stations');
      return;
    }
    var s = stationById(ui.detailStation);
    var unlocked = !!state.unlocked[s.id];

    var back = document.createElement('button');
    back.className = 'back-btn';
    back.innerHTML = '&#9664; All stations';
    back.addEventListener('click', function () { setView('stations'); });
    view.appendChild(back);

    var head = document.createElement('div');
    head.className = 'section';
    head.innerHTML =
      '<p class="station-title">' + s.num + ' — ' + s.name + '</p>' +
      '<p class="station-meta">' + s.district + '</p>' +
      '<span class="lock-status ' + (unlocked ? 'unlocked' : 'locked') + '">' + (unlocked ? 'Unlocked' : 'Locked') + '</span>' +
      '<p class="station-desc">' + s.character + '</p>' +
      seasonalNote(s) +
      subsidyNote(s);
    view.appendChild(head);

    if (!unlocked) {
      view.appendChild(buildUnlockSection(s));
    }

    view.appendChild(buildQueueSection(s, unlocked));
    view.appendChild(buildTrainAtStationSection(s, unlocked));
  }

  function buildUnlockSection(s) {
    var sec = document.createElement('div');
    sec.className = 'section';
    var check = checkUnlockRequirements(s.id);

    sec.innerHTML =
      '<p class="section-heading">Unlock This Station</p>' +
      '<div class="summary-row"><span>Unlock cost</span><span class="' + (state.cash >= s.unlockCost ? 'summary-pos' : 'summary-neg') + '">' + fmtMoney(s.unlockCost) + '</span></div>' +
      '<div class="summary-row"><span>Reputation needed</span><span class="' + (state.reputation >= s.unlockRep ? 'summary-pos' : 'summary-neg') + '">' + s.unlockRep + '</span></div>' +
      '<div class="summary-row"><span>Line access</span><span class="' + (hasUnlockedNeighbor(s.id) ? 'summary-pos' : 'summary-neg') + '">' + (hasUnlockedNeighbor(s.id) ? 'OK' : 'No unlocked neighbor') + '</span></div>' +
      '<button class="btn primary" id="unlock-btn" style="width:100%;margin-top:12px;"' + (check.ok ? '' : ' disabled') + '>Unlock ' + s.name + '</button>';

    sec.querySelector('#unlock-btn').addEventListener('click', function () { unlockStation(s.id); });
    return sec;
  }

  function buildQueueSection(s, unlocked) {
    var sec = document.createElement('div');
    sec.className = 'section';

    if (!unlocked) {
      sec.innerHTML = '<p class="section-heading">Queue</p><div class="placeholder-box">Station is locked — no passenger demand here yet.</div>';
      return sec;
    }

    var queue = state.queues[s.id] || [];
    var sortModes = [
      { key: 'wait', label: 'Wait' },
      { key: 'destination', label: 'Dest' },
      { key: 'fare', label: 'Fare' }
    ];
    var sortRow = '<div class="queue-sort-row">' + sortModes.map(function (m) {
      return '<button class="queue-sort-btn' + (state.queueSort === m.key ? ' active' : '') + '" data-sort="' + m.key + '">' + m.label + '</button>';
    }).join('') + '</div>';

    var listHtml;
    if (queue.length === 0) {
      listHtml = '<div class="placeholder-box">No passengers waiting.</div>';
    } else {
      var nowAbs = state.year * 12 + state.month;
      var sorted = sortQueueEntries(queue);
      listHtml = '<div class="queue-list">' + sorted.map(function (g) {
        var dest = stationById(g.destination);
        var wait = Math.max(0, nowAbs - g.spawnMonth);
        var unhappy = MTA.isGroupUnhappy(g);
        return '<div class="queue-item' + (unhappy ? ' unhappy' : '') + '">' +
          '<span class="queue-dest">&rarr; ' + dest.name + '<br><span class="queue-wait">' + wait + ' mo wait' + (unhappy ? ' · unhappy' : '') + '</span></span>' +
          '<span class="queue-fare">$' + g.fare + '</span>' +
          '</div>';
      }).join('') + '</div>';
    }

    sec.innerHTML = '<p class="section-heading">Queue (' + queue.length + '/' + QUEUE_MAX_PER_STATION + ')</p>' + sortRow + listHtml;

    var btns = sec.querySelectorAll('.queue-sort-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        state.queueSort = this.getAttribute('data-sort');
        saveState();
        renderAll();
      });
    }
    return sec;
  }

  function buildTrainAtStationSection(s, unlocked) {
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = '<p class="section-heading">Trains</p>';

    if (!unlocked) {
      sec.appendChild(placeholder('Station is locked — no service here yet.'));
      return sec;
    }

    var here = state.trains.filter(function (t) { return t.atStation === s.id; });
    if (here.length === 0) {
      var onRoute = state.trains.filter(function (t) { return t.route.indexOf(s.id) !== -1; });
      sec.appendChild(placeholder(onRoute.length
        ? 'On ' + onRoute.length + ' route' + (onRoute.length > 1 ? 's' : '') + ', but no train is standing here right now.'
        : 'No train here. Route one through this station from the Train tab.'));
      return sec;
    }

    here.forEach(function (train) {
      var hasRoute = train.route.length >= 2;
      var box = document.createElement('div');
      box.className = 'notice-box';
      box.style.margin = '0 0 8px 0';
      box.innerHTML = '<strong>' + train.name + '</strong> — onboard ' + train.manifest.length + '/' + train.capacity +
        (hasRoute ? '.' : '. No route set.');
      sec.appendChild(box);

      var row = document.createElement('div');
      row.className = 'btn-row';
      row.style.margin = '0 0 12px 0';
      if (hasRoute) {
        var d = document.createElement('button');
        d.className = 'btn primary';
        d.textContent = 'Dispatch';
        d.addEventListener('click', function () { dispatchTrain(train.id); });
        row.appendChild(d);
      } else {
        var g = document.createElement('button');
        g.className = 'btn';
        g.textContent = 'Set route';
        g.addEventListener('click', function () { ui.selectedTrain = train.id; setView('train'); });
        row.appendChild(g);
      }
      sec.appendChild(row);
    });
    return sec;
  }

  function placeholder(text) {
    var d = document.createElement('div');
    d.className = 'placeholder-box';
    d.textContent = text;
    return d;
  }

  function buildRouteStrip(stops, currentIndex, dir) {
    var strip = document.createElement('div');
    strip.className = 'route-strip';
    stops.forEach(function (id, idx) {
      var st = stationById(id);
      var isCurrent = idx === currentIndex;
      var row = document.createElement('div');
      row.className = 'rs-row' + (isCurrent ? ' current' : '') + (stops.length === 1 ? ' rs-single' : '');

      var note = '';
      if (isCurrent && dir !== null) {
        note = 'Train here' + (stops.length > 1 ? (dir === 1 ? ' &#9660; next' : ' &#9650; next') : '');
      }

      row.innerHTML =
        '<div class="rs-marker"><div class="rs-dot"></div></div>' +
        '<div class="rs-body">' +
          '<span class="rs-name">' + st.name + '</span>' +
          (note ? '<span class="rs-note">' + note + '</span>' : '') +
        '</div>';
      strip.appendChild(row);
    });
    return strip;
  }

  function startRouteEdit() {
    ui.editingRoute = true;
    ui.routeDraft = getSelectedTrain().route.slice();
    renderAll();
  }

  function cancelRouteEdit() {
    ui.editingRoute = false;
    ui.routeDraft = [];
    renderAll();
  }

  function saveRouteDraft() {
    var train = getSelectedTrain();
    if (ui.routeDraft.length < 2) {
      alert('A route needs at least two stops. Add another connected station.');
      return;
    }
    train.route = ui.routeDraft.slice();
    train.posIndex = 0;
    train.dir = 1;
    train.atStation = train.route[0];
    ui.editingRoute = false;
    ui.routeDraft = [];
    saveState();
    renderAll();
  }

  function addDraftStop(id) {
    var draft = ui.routeDraft;
    if (draft.length > 0) {
      var last = draft[draft.length - 1];
      if (last === id) return;
      if (!isTrackBuilt(last, id)) return;
    }
    draft.push(id);
    renderAll();
  }

  function draftCandidates() {
    var draft = ui.routeDraft;
    if (draft.length === 0) {
      return unlockedStationIds();
    }
    var last = draft[draft.length - 1];
    var adj = getAdjacency()[last] || [];
    return adj.filter(function (id) {
      return state.unlocked[id] && isTrackBuilt(last, id) && id !== last;
    });
  }

  function renderTrainView() {
    var view = document.getElementById('view-train');
    view.innerHTML = '';

    // Fleet roster: pick which train this tab controls (only when >1).
    if (state.trains.length > 1) view.appendChild(buildFleetRoster());

    var train = getSelectedTrain();
    if (!train) {
      view.appendChild(buildBuySection());
      return;
    }

    var card = document.createElement('div');
    card.className = 'section';
    card.innerHTML =
      '<p class="train-name">' + train.name + '</p>' +
      '<p class="train-flavor">' + train.flavor + '</p>' +
      '<div class="train-specs">' +
        '<span>Onboard <strong>' + train.manifest.length + '/' + train.capacity + ' groups</strong></span>' +
        '<span>Speed <strong>' + train.speedLabel + '</strong></span>' +
        '<span>At <strong>' + stationById(train.atStation).name + '</strong></span>' +
      '</div>';
    view.appendChild(card);

    // Manifest — who is onboard and where they're going
    var manifestSec = document.createElement('div');
    manifestSec.className = 'section';
    var manifestHtml;
    if (train.manifest.length === 0) {
      manifestHtml = '<div class="placeholder-box">No passengers onboard.</div>';
    } else {
      manifestHtml = '<div class="queue-list">' + train.manifest.map(function (g) {
        var dest = stationById(g.destination);
        return '<div class="queue-item">' +
          '<span class="queue-dest">&rarr; ' + dest.name + '</span>' +
          '<span class="queue-fare">$' + g.fare + '</span>' +
          '</div>';
      }).join('') + '</div>';
    }
    manifestSec.innerHTML = '<p class="section-heading">Onboard (' + train.manifest.length + '/' + train.capacity + ')</p>' + manifestHtml;
    view.appendChild(manifestSec);

    var routeSec = document.createElement('div');
    routeSec.className = 'section';

    if (ui.editingRoute) {
      routeSec.innerHTML = '<p class="section-heading">Editing Route</p>';

      if (ui.routeDraft.length === 0) {
        var hint = document.createElement('div');
        hint.className = 'placeholder-box';
        hint.style.marginBottom = '12px';
        hint.textContent = 'Pick a starting station below.';
        routeSec.appendChild(hint);
      } else {
        routeSec.appendChild(buildRouteStrip(ui.routeDraft, -1, null));
      }

      var candidates = draftCandidates();
      var candHeading = document.createElement('p');
      candHeading.className = 'section-heading';
      candHeading.style.marginTop = '12px';
      candHeading.textContent = ui.routeDraft.length === 0 ? 'Start at' : 'Add next stop';
      routeSec.appendChild(candHeading);

      if (candidates.length === 0) {
        var noCand = document.createElement('div');
        noCand.className = 'placeholder-box';
        var lastName = stationById(ui.routeDraft[ui.routeDraft.length - 1]).name;
        noCand.innerHTML = 'No built track onward from ' + lastName + '. Lay track in the <strong>Build</strong> tab, or undo the last stop.';
        routeSec.appendChild(noCand);
      } else {
        var candList = document.createElement('div');
        candList.className = 'candidate-list';
        candidates.forEach(function (id) {
          var b = document.createElement('button');
          b.className = 'candidate-btn';
          b.textContent = stationById(id).name;
          b.addEventListener('click', function () { addDraftStop(id); });
          candList.appendChild(b);
        });
        routeSec.appendChild(candList);
      }

      var btnRow = document.createElement('div');
      btnRow.className = 'btn-row';
      btnRow.style.marginTop = '14px';

      var undoBtn = document.createElement('button');
      undoBtn.className = 'btn small';
      undoBtn.textContent = 'Undo';
      undoBtn.disabled = ui.routeDraft.length === 0;
      undoBtn.addEventListener('click', function () { ui.routeDraft.pop(); renderAll(); });

      var clearBtn = document.createElement('button');
      clearBtn.className = 'btn small';
      clearBtn.textContent = 'Clear';
      clearBtn.disabled = ui.routeDraft.length === 0;
      clearBtn.addEventListener('click', function () { ui.routeDraft = []; renderAll(); });

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn small';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', cancelRouteEdit);

      var saveBtn = document.createElement('button');
      saveBtn.className = 'btn primary';
      saveBtn.textContent = 'Save Route';
      saveBtn.addEventListener('click', saveRouteDraft);

      btnRow.appendChild(undoBtn);
      btnRow.appendChild(clearBtn);
      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(saveBtn);
      routeSec.appendChild(btnRow);
    } else {
      routeSec.innerHTML = '<p class="section-heading">Route</p>';

      if (train.route.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'placeholder-box';
        empty.textContent = 'No route set. Old Betsy is going nowhere.';
        routeSec.appendChild(empty);
      } else {
        routeSec.appendChild(buildRouteStrip(train.route, train.posIndex, train.dir));
      }

      var actions = document.createElement('div');
      actions.className = 'btn-row';
      actions.style.marginTop = '12px';

      var editBtn = document.createElement('button');
      editBtn.className = 'btn';
      editBtn.textContent = train.route.length === 0 ? 'Set Route' : 'Edit Route';
      editBtn.addEventListener('click', startRouteEdit);

      var dispatchBtn = document.createElement('button');
      dispatchBtn.className = 'btn primary';
      dispatchBtn.textContent = 'Dispatch';
      dispatchBtn.disabled = train.route.length < 2;
      dispatchBtn.addEventListener('click', function () { dispatchTrain(train.id); });

      actions.appendChild(editBtn);
      actions.appendChild(dispatchBtn);
      routeSec.appendChild(actions);
    }

    view.appendChild(routeSec);
    view.appendChild(buildBuySection());
  }

  function buildFleetRoster() {
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = '<p class="section-heading">Fleet (' + state.trains.length + ')</p>';

    var roster = document.createElement('div');
    roster.className = 'fleet-roster';
    var selId = getSelectedTrain() ? getSelectedTrain().id : null;
    state.trains.forEach(function (t) {
      var chip = document.createElement('button');
      chip.className = 'fleet-chip' + (t.id === selId ? ' active' : '');
      var where = stationById(t.atStation) ? stationById(t.atStation).name : '—';
      chip.innerHTML =
        '<div class="fc-name">' + t.name + '</div>' +
        '<div class="fc-sub">cap ' + t.capacity + ' · ' + (t.route.length >= 2 ? 'routed' : 'idle') + '</div>' +
        '<div class="fc-sub">@ ' + where + '</div>';
      chip.addEventListener('click', function () {
        if (ui.selectedTrain !== t.id) {
          ui.selectedTrain = t.id;
          ui.editingRoute = false;   // don't carry a half-built draft between trains
          ui.routeDraft = [];
        }
        renderAll();
      });
      roster.appendChild(chip);
    });
    sec.appendChild(roster);
    return sec;
  }

  function buildBuySection() {
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = '<p class="section-heading">Buy a Train</p>' +
      '<div class="notice-box" style="margin-bottom:10px;">Another train means another route running at once — but adds monthly maintenance. New stock unlocks as reputation grows.</div>';

    TRAIN_TYPES.forEach(function (type) {
      var repOk = state.reputation >= type.minRep;
      var affordable = state.cash >= type.cost;

      var row = document.createElement('div');
      row.className = 'segment-row' + (repOk ? '' : ' unavailable');

      var main = document.createElement('div');
      main.className = 'seg-main';
      main.innerHTML =
        '<p class="seg-names">' + type.name + ' <span class="seg-link">' + fmtMoney(type.cost) + '</span></p>' +
        '<p class="seg-sub">' + (repOk
          ? 'Cap ' + type.capacity + ' · ' + type.speedLabel + ' · maint ' + fmtMoney(type.maintenance) + '/mo'
          : 'Locked — needs reputation ' + type.minRep) + '</p>';
      row.appendChild(main);

      var status = document.createElement('div');
      status.className = 'seg-status';
      if (!repOk) {
        status.innerHTML = '<span class="badge locked-cost">Rep ' + type.minRep + '</span>';
      } else {
        var buyBtn = document.createElement('button');
        buyBtn.className = 'btn small primary';
        buyBtn.textContent = 'Buy';
        buyBtn.disabled = !affordable;
        buyBtn.addEventListener('click', function () { buyTrain(type.id); });
        status.appendChild(buyBtn);
      }
      row.appendChild(status);
      sec.appendChild(row);
    });
    return sec;
  }

  function renderBuildView() {
    var view = document.getElementById('view-build');
    view.innerHTML = '';

    var intro = document.createElement('div');
    intro.className = 'section';
    intro.innerHTML =
      '<p class="section-heading">Lay Track</p>' +
      '<div class="notice-box">Track costs <strong>' + fmtMoney(TRACK_COST) + '</strong> per segment. Both stations must be unlocked. Trains can only run over built track.</div>';
    view.appendChild(intro);

    CONNECTIONS.forEach(function (pair) {
      var a = stationById(pair[0]);
      var b = stationById(pair[1]);
      var built = isTrackBuilt(a.id, b.id);
      var bothUnlocked = !!state.unlocked[a.id] && !!state.unlocked[b.id];

      var row = document.createElement('div');
      row.className = 'segment-row' + (built || bothUnlocked ? '' : ' unavailable');

      var sub;
      if (built) {
        sub = 'In service';
      } else if (!bothUnlocked) {
        var lockedNames = [];
        if (!state.unlocked[a.id]) lockedNames.push(a.name);
        if (!state.unlocked[b.id]) lockedNames.push(b.name);
        sub = 'Unlock ' + lockedNames.join(' and ') + ' first';
      } else {
        sub = 'Ready to build — ' + fmtMoney(TRACK_COST);
      }

      var main = document.createElement('div');
      main.className = 'seg-main';
      main.innerHTML =
        '<p class="seg-names">' + a.name + ' <span class="seg-link">&#8596;</span> ' + b.name + '</p>' +
        '<p class="seg-sub">' + sub + '</p>';
      row.appendChild(main);

      var status = document.createElement('div');
      status.className = 'seg-status';
      if (built) {
        status.innerHTML = '<span class="badge built">Built</span>';
      } else if (bothUnlocked) {
        var buildBtn = document.createElement('button');
        buildBtn.className = 'btn small primary';
        buildBtn.textContent = 'Build';
        buildBtn.disabled = state.cash < TRACK_COST;
        buildBtn.addEventListener('click', function () { buildTrack(a.id, b.id); });
        status.appendChild(buildBtn);
      } else {
        status.innerHTML = '<span class="badge locked-cost">Locked</span>';
      }
      row.appendChild(status);

      view.appendChild(row);
    });
  }

  function showMonthlySummary(summary) {
    var body = document.getElementById('summary-body');
    var sign = summary.net >= 0 ? '+' : '−';
    var subsidyRow = summary.subsidy > 0
      ? '<div class="summary-row"><span>Govt. subsidy (' + summary.subsidyStations + ' district' + (summary.subsidyStations === 1 ? '' : 's') + ')</span><span class="summary-pos">+' + fmtMoney(summary.subsidy) + '</span></div>'
      : '';
    var happinessRow = (summary.unhappyGroups > 0 || summary.abandonedGroups > 0)
      ? '<div class="summary-row"><span>Unhappy passengers</span><span class="summary-neg">' + summary.unhappyGroups +
          (summary.abandonedGroups > 0 ? ' (' + summary.abandonedGroups + ' left)' : '') + '</span></div>'
      : '';
    body.innerHTML =
      '<p class="train-name" style="margin-bottom:14px;">' + summary.label + '</p>' +
      '<div class="summary-row"><span>Fares collected</span><span class="summary-pos">+' + fmtMoney(summary.revenue) + '</span></div>' +
      subsidyRow +
      '<div class="summary-row"><span>Maintenance</span><span class="summary-neg">−' + fmtMoney(summary.maintenance) + '</span></div>' +
      '<div class="summary-row"><span>Staff overhead</span><span class="summary-neg">−' + fmtMoney(summary.staff) + '</span></div>' +
      '<div class="summary-row summary-net"><span>Net</span><span class="' + (summary.net >= 0 ? 'summary-pos' : 'summary-neg') + '">' + sign + fmtMoney(Math.abs(summary.net)) + '</span></div>' +
      happinessRow +
      '<div class="summary-row"><span>Reputation</span><span class="' + (summary.repDelta >= 0 ? 'summary-pos' : 'summary-neg') + '">' + (summary.repDelta >= 0 ? '+' : '') + summary.repDelta + '</span></div>' +
      '<div class="summary-row summary-balance"><span>Cash balance</span><span>' + fmtMoney(state.cash) + '</span></div>' +
      '<button class="btn primary" id="summary-continue" style="width:100%;margin-top:14px;">Continue</button>';
    document.getElementById('summary-continue').addEventListener('click', closeSummary);
    document.getElementById('summary-overlay').classList.add('visible');
  }

  function closeSummary() {
    document.getElementById('summary-overlay').classList.remove('visible');
  }

  function renderAll() {
    renderHeader();
    renderNav();
    renderControlBoard();

    var views = ['stations', 'detail', 'train', 'build'];
    views.forEach(function (v) {
      document.getElementById('view-' + v).classList.toggle('active', ui.view === v);
    });

    if (ui.view === 'stations') renderStationsView();
    else if (ui.view === 'detail') renderDetailView();
    else if (ui.view === 'train') renderTrainView();
    else if (ui.view === 'build') renderBuildView();
  }

  document.getElementById('nav-stations').addEventListener('click', function () { setView('stations'); });
  document.getElementById('nav-train').addEventListener('click', function () { setView('train'); });
  document.getElementById('nav-build').addEventListener('click', function () { setView('build'); });
  document.getElementById('nav-end-month').addEventListener('click', endMonth);

  MTA.init();

  renderAll();
})();
</script>
</body>
</html>
